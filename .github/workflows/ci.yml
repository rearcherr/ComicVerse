name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/ComicVerse.Core/ComicVerse.Core.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/ComicVerse.App/ComicVerse.App.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/ComicVerse.Tests/ComicVerse.Tests.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Core tests
        shell: pwsh
        run: |
          dotnet run --project tests/ComicVerse.Tests/ComicVerse.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UI smoke
        shell: pwsh
        env:
          COMICVERSE_DATA_DIR: ${{ runner.temp }}/comicverse-ci-data
          SMOKE_OUT_DIR: ${{ runner.temp }}/comicverse-ci-smoke
        run: |
          & './src/ComicVerse.App/bin/Release/net10.0-windows/ComicVerse.exe' --smoke './samples'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comicverse-smoke
          path: ${{ runner.temp }}/comicverse-ci-smoke
          if-no-files-found: ignore
          retention-days: 7
