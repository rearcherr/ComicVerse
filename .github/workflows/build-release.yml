name: build-release

# CI only creates a candidate for independent QA; tags never rebuild or publish it.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Record candidate version and source inputs
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$taskProject = Get-Content -LiteralPath 'src/ComicVerse.App/ComicVerse.App.csproj' -Raw
          $taskVersion = [string]$taskProject.Project.PropertyGroup.Version
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid source version.' }
          "CV_VERSION=$taskVersion" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $taskRoot = Join-Path $env:RUNNER_TEMP "comicverse-ci-candidate-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $taskEvidence = Join-Path $env:RUNNER_TEMP "comicverse-candidate-evidence-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          @("CV_CANDIDATE_DIR=$taskRoot", "CV_EVIDENCE_DIR=$taskEvidence") | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path $taskRoot | Out-Null
          $taskFiles = @(git -c core.quotepath=false ls-files -- src tests tools samples 'docs/使用说明.txt' LICENSE .github/workflows)
          if ($LASTEXITCODE -ne 0 -or $taskFiles.Count -eq 0) { throw 'Cannot inventory candidate inputs.' }
          $taskManifest = @($taskFiles | ForEach-Object {
            [ordered]@{ Path = $_; Length = (Get-Item -LiteralPath $_).Length; SHA256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }
          })
          [ordered]@{ Commit = $env:GITHUB_SHA; Version = $taskVersion; Files = $taskManifest } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $taskRoot 'source-freeze.json') -Encoding utf8
          Write-Output "Candidate version=$taskVersion; frozen inputs=$($taskManifest.Count)"

      # One runner invocation per step preserves its real exit code.
      - name: Build Core on isolated desktop
        run: |
          & './tools/Invoke-IsolatedProcess.ps1' -FilePath (Get-Command dotnet -CommandType Application).Source -ArgumentList @('build', 'src/ComicVerse.Core/ComicVerse.Core.csproj', '-c', 'Release', '--nologo', '-warnaserror') -EvidenceDirectory (Join-Path $env:CV_EVIDENCE_DIR 'build-core') -TimeoutSeconds 600
          exit $LASTEXITCODE

      - name: Build App on isolated desktop
        run: |
          & './tools/Invoke-IsolatedProcess.ps1' -FilePath (Get-Command dotnet -CommandType Application).Source -ArgumentList @('build', 'src/ComicVerse.App/ComicVerse.App.csproj', '-c', 'Release', '--nologo', '-warnaserror') -EvidenceDirectory (Join-Path $env:CV_EVIDENCE_DIR 'build-app') -TimeoutSeconds 600
          exit $LASTEXITCODE

      - name: Build tests on isolated desktop
        run: |
          & './tools/Invoke-IsolatedProcess.ps1' -FilePath (Get-Command dotnet -CommandType Application).Source -ArgumentList @('build', 'tests/ComicVerse.Tests/ComicVerse.Tests.csproj', '-c', 'Release', '--nologo', '-warnaserror') -EvidenceDirectory (Join-Path $env:CV_EVIDENCE_DIR 'build-tests') -TimeoutSeconds 600
          exit $LASTEXITCODE

      - name: Core tests on isolated desktop
        run: |
          & './tools/Invoke-IsolatedProcess.ps1' -FilePath (Join-Path $PWD 'tests/ComicVerse.Tests/bin/Release/net10.0-windows/ComicVerse.Tests.exe') -EvidenceDirectory (Join-Path $env:CV_EVIDENCE_DIR 'core-tests') -TimeoutSeconds 300
          exit $LASTEXITCODE

      - name: Publish candidate on isolated desktop
        run: |
          & './tools/Invoke-IsolatedProcess.ps1' -FilePath (Get-Command dotnet -CommandType Application).Source -ArgumentList @('publish', 'src/ComicVerse.App/ComicVerse.App.csproj', '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true', '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true', "-p:Version=$env:CV_VERSION", '--nologo', '-warnaserror', '-o', (Join-Path $env:CV_CANDIDATE_DIR 'publish')) -EvidenceDirectory (Join-Path $env:CV_EVIDENCE_DIR 'publish') -TimeoutSeconds 600
          exit $LASTEXITCODE

      - name: Package and unpack the CI candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = $env:CV_CANDIDATE_DIR
          $taskPackage = Join-Path $taskRoot 'package'
          New-Item -ItemType Directory -Path $taskPackage | Out-Null
          Copy-Item -LiteralPath (Join-Path $taskRoot 'publish/ComicVerse.exe') -Destination $taskPackage
          Copy-Item -LiteralPath 'docs/使用说明.txt', 'LICENSE', 'samples' -Destination $taskPackage -Recurse
          $taskZip = Join-Path $taskRoot "ComicVerse-Portable-v$($env:CV_VERSION)-win-x64.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($taskPackage, $taskZip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $taskBundle = Join-Path $taskRoot 'smoke-bundle'
          [IO.Compression.ZipFile]::ExtractToDirectory($taskZip, $taskBundle)
          $taskExeHash = (Get-FileHash -LiteralPath (Join-Path $taskPackage 'ComicVerse.exe') -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath (Join-Path $taskBundle 'ComicVerse.exe') -Algorithm SHA256).Hash -ne $taskExeHash) { throw 'ZIP EXE differs from candidate.' }
          foreach ($taskRequired in @('ComicVerse.exe', '使用说明.txt', 'LICENSE', 'samples')) {
            if (-not (Test-Path -LiteralPath (Join-Path $taskBundle $taskRequired))) { throw "Missing package input: $taskRequired" }
          }
          [ordered]@{
            Status = 'ci_candidate_requires_independent_qa'; Version = $env:CV_VERSION; Commit = $env:GITHUB_SHA
            ExeSHA256 = $taskExeHash; ZipSHA256 = (Get-FileHash -LiteralPath $taskZip -Algorithm SHA256).Hash
            SourceManifestSHA256 = (Get-FileHash -LiteralPath (Join-Path $taskRoot 'source-freeze.json') -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $taskRoot 'candidate.json') -Encoding utf8

      - name: Actual packaged App smoke on isolated desktop
        run: |
          $taskBundle = Join-Path $env:CV_CANDIDATE_DIR 'smoke-bundle'
          & './tools/Invoke-IsolatedProcess.ps1' -FilePath (Join-Path $taskBundle 'ComicVerse.exe') -ArgumentList @('--smoke', (Join-Path $taskBundle 'samples')) -EvidenceDirectory (Join-Path $env:CV_EVIDENCE_DIR 'ui-smoke') -TimeoutSeconds 300
          exit $LASTEXITCODE

      - name: Verify smoke isolation and frozen bytes after execution
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = $env:CV_CANDIDATE_DIR
          $taskEvidence = Join-Path $env:CV_EVIDENCE_DIR 'ui-smoke'
          $taskStart = Get-Content -LiteralPath (Join-Path $taskEvidence 'execution-start.json') -Raw | ConvertFrom-Json
          $taskResult = Get-Content -LiteralPath (Join-Path $taskEvidence 'execution-result.json') -Raw | ConvertFrom-Json
          $taskApp = Get-Content -LiteralPath (Join-Path $taskEvidence 'smoke/smoke-environment.json') -Raw | ConvertFrom-Json
          if ($taskResult.ExitCode -ne 0 -or $taskResult.TimedOut) { throw 'Candidate smoke failed or timed out.' }
          if ($taskStart.Desktop -notlike 'ComicVerse-QA-*' -or $taskApp.Desktop -ne $taskStart.Desktop -or
              $taskResult.Desktop -ne $taskStart.Desktop -or $taskApp.ProcessId -ne $taskStart.Pid -or
              -not $taskApp.SmokeProcess -or ($taskApp.ErrorMode -band 0x8003) -ne 0x8003) { throw 'Actual App isolation evidence does not match the runner.' }
          if (Test-Path -LiteralPath (Join-Path $taskEvidence 'smoke/smoke-crash.txt')) { throw 'Candidate recorded an unhandled exception.' }
          $taskCandidate = Get-Content -LiteralPath (Join-Path $taskRoot 'candidate.json') -Raw | ConvertFrom-Json
          if ((Get-FileHash -LiteralPath (Join-Path $taskRoot 'source-freeze.json') -Algorithm SHA256).Hash -ne $taskCandidate.SourceManifestSHA256) { throw 'Source manifest changed.' }
          $taskManifest = Get-Content -LiteralPath (Join-Path $taskRoot 'source-freeze.json') -Raw | ConvertFrom-Json
          foreach ($taskFile in $taskManifest.Files) {
            if ((Get-FileHash -LiteralPath $taskFile.Path -Algorithm SHA256).Hash -ne $taskFile.SHA256) { throw "Input changed: $($taskFile.Path)" }
          }
          foreach ($taskExe in @('package/ComicVerse.exe', 'smoke-bundle/ComicVerse.exe')) {
            if ((Get-FileHash -LiteralPath (Join-Path $taskRoot $taskExe) -Algorithm SHA256).Hash -ne $taskCandidate.ExeSHA256) { throw 'Candidate EXE changed.' }
          }
          $taskZip = Join-Path $taskRoot "ComicVerse-Portable-v$($env:CV_VERSION)-win-x64.zip"
          if ((Get-FileHash -LiteralPath $taskZip -Algorithm SHA256).Hash -ne $taskCandidate.ZipSHA256) { throw 'Candidate ZIP changed.' }
          Get-Content -LiteralPath (Join-Path $taskEvidence 'smoke/summary.txt')

      - name: Print packaged App smoke diagnostics
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CV_EVIDENCE_DIR)) {
            Write-Output 'Smoke evidence root was not initialized.'
            return
          }
          $taskEvidence = Join-Path $env:CV_EVIDENCE_DIR 'ui-smoke'
          $taskFiles = @(
            'execution-start.json', 'execution-result.json', 'stdout.log', 'stderr.log',
            'smoke/smoke-environment.json', 'smoke/summary.txt', 'smoke/smoke-crash.txt',
            'smoke/opc-reliability-summary.txt', 'smoke/logic-audit-summary.txt',
            'smoke/novel-expansion-summary.txt', 'smoke/input-summary.txt'
          )
          # Treat evidence as plain text, never as runner workflow commands.
          $taskLogToken = [guid]::NewGuid().ToString('N')
          Write-Output "::stop-commands::$taskLogToken"
          try {
            foreach ($taskFile in $taskFiles) {
              Write-Output "--- ui-smoke/$taskFile ---"
              try {
                $taskPath = Join-Path $taskEvidence $taskFile
                if (Test-Path -LiteralPath $taskPath -PathType Leaf) {
                  Get-Content -LiteralPath $taskPath -Encoding utf8 -ErrorAction Stop
                } else {
                  Write-Output '(not present)'
                }
              } catch {
                Write-Output "(could not read: $($_.Exception.Message))"
              }
            }
          } finally {
            Write-Output "::$taskLogToken::"
          }

      - name: Upload CI candidate for independent QA
        uses: actions/upload-artifact@v4
        with:
          name: comicverse-candidate-${{ env.CV_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CV_CANDIDATE_DIR }}/package/ComicVerse.exe
            ${{ env.CV_CANDIDATE_DIR }}/ComicVerse-Portable-*.zip
            ${{ env.CV_CANDIDATE_DIR }}/source-freeze.json
            ${{ env.CV_CANDIDATE_DIR }}/candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload all candidate isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comicverse-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/comicverse-candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
