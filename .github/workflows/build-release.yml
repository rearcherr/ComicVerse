name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build
        run: dotnet build ComicVerse.slnx -c Release

      - name: Core tests
        run: dotnet run --project tests/ComicVerse.Tests/ComicVerse.Tests.csproj -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish src/ComicVerse.App/ComicVerse.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: UI smoke test (published exe)
        shell: pwsh
        run: |
          $env:COMICVERSE_DATA_DIR = Join-Path $env:TEMP ('cv-ci-' + [guid]::NewGuid().ToString('N').Substring(0,8))
          $env:SMOKE_OUT_DIR = Join-Path $env:TEMP 'cv-smoke-out'
          & './publish/ComicVerse.exe' --smoke './samples'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item './docs/使用说明.txt' './publish/使用说明.txt'
          Compress-Archive -Path './publish/ComicVerse.exe','./publish/使用说明.txt' -DestinationPath "ComicVerse-Portable-$($env:GITHUB_REF_NAME)-win-x64.zip"
          Get-ChildItem -Filter "ComicVerse-Portable-*" | Select-Object Name, Length

      - name: Collect Android APK
        shell: pwsh
        run: |
          $apk = 'src/ComicVerse.Android/bin/Release/net10.0-android/com.comicverse.reader-Signed.apk'
          if (-not (Test-Path $apk)) { throw "APK 未生成: $apk" }
          Copy-Item $apk "ComicVerse-$($env:GITHUB_REF_NAME)-android.apk"
          Get-Item "ComicVerse-$($env:GITHUB_REF_NAME)-android.apk" | Select-Object Name, Length

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ComicVerse-Portable-${{ github.ref_name }}-win-x64.zip
            ComicVerse-${{ github.ref_name }}-android.apk
            publish/ComicVerse.exe
